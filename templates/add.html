<!DOCTYPE html>
<html>
<head>
    <title>Add Contact</title>
</head>
<body>
    <h1>Add New Contact</h1>

        <button type="submit">Save Contact</button>
    </form>
    <a href="/contacts">Back to contacts</a>
</body>
</html>
